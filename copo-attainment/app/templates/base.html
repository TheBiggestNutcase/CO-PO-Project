<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CO-PO Attainment{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('setup.list_courses') }}">CO-PO Attainment</a>
        {% if course %}
        <nav>
            <a href="{{ url_for('setup.course_detail', course_id=course.id) }}"
               class="{{ 'active' if request.endpoint == 'setup.course_detail' }}">{{ course.subject_code }}</a>
        </nav>
        {% endif %}
    </header>
    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
