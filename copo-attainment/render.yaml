services:
  - type: web
    name: copo-attainment
    runtime: docker
    plan: free
    # The git repo root (COPO-Project) is one level above this app
    # (copo-attainment/) - rootDir tells Render to treat this subfolder
    # as the build context. dockerfilePath below is then relative to
    # THAT directory, not the repo root.
    rootDir: copo-attainment
    dockerfilePath: Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # set this by hand in the Render dashboard - see DEPLOYMENT.md
